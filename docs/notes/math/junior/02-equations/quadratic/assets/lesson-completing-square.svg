<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 255" role="img" aria-labelledby="title"><title id="title">配方把x平方加六x补成x加三的平方</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><text x="300" y="45" font-size="25" fill="#334155" text-anchor="middle" font-weight="normal">x² + 6x 需要补什么？</text><text x="300" y="105" font-size="30" fill="#2563eb" text-anchor="middle" font-weight="normal">(x + 3)² = x² + 6x + 9</text><text x="300" y="158" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">6 的一半是 3，3 的平方是 9</text><text x="300" y="214" font-size="22" fill="#d97706" text-anchor="middle" font-weight="normal">配方：两边同时加 9</text></g></svg>
