<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 165" role="img" aria-labelledby="title"><title id="title">等式两边同时减三仍然相等</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><rect x="35" y="35" width="153.333" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="111.667" y="68" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="normal">原方程</text><text x="111.667" y="103" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">2x + 3 = 7</text><line x1="193.333" y1="80" x2="217.333" y2="80" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="223.333" y="35" width="153.333" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="300" y="68" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="normal">两边都减 3</text><text x="300" y="103" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">2x = 4</text><line x1="381.667" y1="80" x2="405.667" y2="80" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="411.667" y="35" width="153.333" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="488.333" y="68" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="normal">两边都除以 2</text><text x="488.333" y="103" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">x = 2</text></g></svg>
