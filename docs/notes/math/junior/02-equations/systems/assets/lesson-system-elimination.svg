<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="title"><title id="title">两种消元方法都把二元方程组化成一元方程</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><text x="300" y="35" font-size="24" fill="#334155" text-anchor="middle" font-weight="normal">x + y = 5，x − y = 1</text><rect x="30" y="65" width="250" height="145" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="155" y="96" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="normal">代入消元</text><text x="155" y="129" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">x = y + 1</text><text x="155" y="159" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">(y + 1) + y = 5</text><text x="155" y="189" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">2y = 4 → y = 2</text><rect x="320" y="65" width="250" height="145" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="445" y="96" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="normal">加减消元</text><text x="445" y="129" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">两式相加，消去 y</text><text x="445" y="159" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">2x = 6</text><text x="445" y="189" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">x = 3</text><text x="300" y="245" font-size="21" fill="#d97706" text-anchor="middle" font-weight="normal">回代后都得到：x = 3，y = 2</text></g></svg>
