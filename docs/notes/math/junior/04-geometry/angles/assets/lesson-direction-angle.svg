<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" role="img" aria-labelledby="title"><title id="title">从正北向东转三十度得到北偏东方向</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><line x1="45" y1="210" x2="295" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="155" y1="270" x2="155" y2="35" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="155" y="26" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">北</text><text x="310" y="216" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">东</text><line x1="155" y1="210" x2="237.5" y2="67.1058" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M182.5,162.369 A55,55 0 0 0 155,155" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/><text x="180" y="131" font-size="20" fill="#d97706" text-anchor="middle" font-weight="normal">30°</text><text x="233" y="60" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="normal">目标</text><text x="155" y="294" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">从北向东量</text></g></svg>
