<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-labelledby="title desc">
<title id="title">三种三角形中高的位置</title>
<desc id="desc">并排对照锐角、直角、钝角三角形的三条高。锐角三角形三条高均在内部；直角三角形两条高与直角边重合，另一条从直角顶点垂直于斜边；钝角三角形一条高在内部、两条在外部。蓝色实线表示高，灰色虚线表示边的延长线，垂足处有直角标记。</desc>
