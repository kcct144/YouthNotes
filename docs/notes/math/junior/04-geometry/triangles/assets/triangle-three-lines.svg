<svg xmlns="http://www.w3.org/2000/svg" width="600" height="275" viewBox="0 0 600 275" role="img" aria-labelledby="title desc">
<title id="title">角平分线、中线、高的对照</title>
<desc id="desc">三个相同的三角形分别画出从A出发的角平分线、中线和高。角平分线使角BAD等于角DAC；中线使BD等于DC；高AD垂直于BC。三种线段的判断依据分别是角相等、边相等和垂直。</desc>
<rect width="600" height="275" rx="12" fill="#fff"/>
<path d="M200 48V258M400 48V258" stroke="#e2e8f0"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#334155" text-anchor="middle"><g transform="translate(0 0)">
<text x="100" y="30" font-size="23" fill="#176aab">角平分线</text>
<path d="M70 72L25 192H175Z" fill="#eff6ff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M70 72L91.840 192" fill="none" stroke="#176aab" stroke-width="2.5"/>
<path d="M61.573 94.472A24 24 0 0 0 74.297 95.612" fill="none" stroke="#176aab" stroke-width="2"/><path d="M74.297 95.612A24 24 0 0 0 85.804 90.062" fill="none" stroke="#176aab" stroke-width="2"/>
<g font-size="19"><text x="68" y="57">A</text><text x="15" y="214">B</text><text x="185" y="214">C</text><text x="91.840" y="216">D</text></g>
<text x="100" y="252" font-size="19" fill="#176aab">∠BAD = ∠DAC</text>
</g><g transform="translate(200 0)">
<text x="100" y="30" font-size="23" fill="#176aab">中线</text>
<path d="M70 72L25 192H175Z" fill="#eff6ff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M70 72L100.000 192" fill="none" stroke="#176aab" stroke-width="2.5"/>
<path d="M62.5 187V197M137.5 187V197" stroke="#176aab" stroke-width="2"/>
<g font-size="19"><text x="68" y="57">A</text><text x="15" y="214">B</text><text x="185" y="214">C</text><text x="100.000" y="216">D</text></g>
<text x="100" y="252" font-size="19" fill="#176aab">BD = DC</text>
</g><g transform="translate(400 0)">
<text x="100" y="30" font-size="23" fill="#176aab">高</text>
<path d="M70 72L25 192H175Z" fill="#eff6ff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M70 72L70.000 192" fill="none" stroke="#176aab" stroke-width="2.5"/>
<path d="M70 180H82V192" fill="none" stroke="#176aab" stroke-width="2"/>
<g font-size="19"><text x="68" y="57">A</text><text x="15" y="214">B</text><text x="185" y="214">C</text><text x="70.000" y="216">D</text></g>
<text x="100" y="252" font-size="19" fill="#176aab">AD ⊥ BC</text>
</g></g></svg>