<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">三角形的顶点、边与角</title>
  <desc id="desc">三角形ABC中，角A、角B、角C的对边分别为BC、AC、AB，记为a、b、c。边BC向右延长到D，角ACD是角ACB的相邻外角。</desc>
  <rect width="520" height="300" rx="12" fill="#fff"/>
  <path d="M70 228L190 60L350 228Z" fill="#eff6ff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M350 228H470" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <g fill="none" stroke="#176aab" stroke-width="2">
    <path d="M171.4 86A32 32 0 0 0 212.1 83.2"/>
    <path d="M102 228A32 32 0 0 0 88.6 202"/>
    <path d="M318 228A32 32 0 0 1 327.9 204.8"/>
  </g>
  <path d="M319.7 196.1A44 44 0 0 1 394 228" fill="none" stroke="#b45309" stroke-width="2"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#334155" text-anchor="middle">
    <text x="190" y="42">A</text><text x="54" y="248">B</text><text x="350" y="253">C</text><text x="483" y="235">D</text>
    <g fill="#176aab" font-family="Georgia, serif" font-size="25" font-style="italic">
      <text x="210" y="254">a</text><text x="289" y="137">b</text><text x="119" y="137">c</text>
    </g>
    <g font-size="18" fill="#176aab"><text x="192" y="120">∠A</text><text x="132" y="214">∠B</text><text x="296" y="214">∠C</text></g>
    <text x="397" y="181" fill="#b45309" font-size="20">外角</text>
    <text x="260" y="285" font-size="18">边 a 对着 ∠A，边 b 对着 ∠B，边 c 对着 ∠C</text>
  </g>
</svg>
