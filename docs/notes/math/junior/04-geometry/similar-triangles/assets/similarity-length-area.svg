<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">相似三角形的周长比与面积比</title><desc id="desc">右侧三角形的对应边是左侧的2倍，周长也是2倍。右侧用三条中位线分成四个与左图全等的小三角形，每块面积为S，因此面积为左图的4倍。</desc><rect width="640" height="320" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><path d="M100.000 100.000L40.000 180.000L180.000 180.000Z" fill="#eff6ff" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/><text x="110" y="57" font-size="21" fill="#334155">原三角形</text><text x="106" y="157" font-size="25" fill="#176aab">S</text><path d="M410.000 50.000L290.000 210.000L570.000 210.000Z" fill="#eff6ff" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/><path d="M350.000 130.000L490.000 130.000" fill="none" stroke="#176aab" stroke-width="2.2"/><path d="M350.000 130.000L430.000 210.000" fill="none" stroke="#176aab" stroke-width="2.2"/><path d="M490.000 130.000L430.000 210.000" fill="none" stroke="#176aab" stroke-width="2.2"/><text x="417" y="103" font-size="25" fill="#176aab">S</text><text x="357" y="184" font-size="25" fill="#176aab">S</text><text x="497" y="184" font-size="25" fill="#176aab">S</text><text x="423" y="157" font-size="25" fill="#176aab">S</text><text x="430" y="28" font-size="21" fill="#334155">对应边变为 2 倍</text><text x="110" y="211" font-size="23" fill="#334155">a</text><text x="430" y="241" font-size="23" fill="#334155">2a</text><path d="M218 135H270M262 129L270 135L262 141" fill="none" stroke="#64748b" stroke-width="2"/><text x="244" y="114" font-size="23" fill="#64748b">×2</text><text x="320" y="294" font-size="24" fill="#176aab">周长变为 2 倍，面积变为 4 倍</text></g></svg>