<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="title desc">
<title id="title">相似三角形的对应顶点、对应角与对应边</title>
<desc id="desc">左图ABC的边AB、BC、AC分别长4、5、6，右图DEF的对应边DE、EF、DF分别长8、10、12。右图由左图按2倍等比例放大得到。顶点按A对应D、B对应E、C对应F配对；对应角用相同数量的圆弧标记，对应边用相同颜色标记。ABC与DEF的相似比为二分之一。</desc>
