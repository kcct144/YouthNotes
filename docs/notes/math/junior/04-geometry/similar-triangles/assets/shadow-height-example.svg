<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img" aria-labelledby="title desc"><title id="title">用标杆的影长测树高</title><desc id="desc">同一时刻、水平地面上，树和标杆都竖直，太阳光方向相同。树影长8米，标杆高1.5米、影长2米，两个直角三角形相似，树高h与1.5米的比等于8与2的比，因此树高为6米。</desc><rect width="520" height="320" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><text x="260" y="28" font-size="22" fill="#334155">同一时刻，地面水平</text><path d="M60.000 90.000L60.000 240.000L260.000 240.000Z" fill="#fffbeb" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/><path d="M370.000 202.500L370.000 240.000L420.000 240.000Z" fill="#eff6ff" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/><path d="M60.000 90.000L260.000 240.000" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M370.000 202.500L420.000 240.000" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M60 90L30 160H90Z" fill="#dcfce7" stroke="#22734f" stroke-width="2"/><path d="M60.000 160.000L60.000 240.000" fill="none" stroke="#22734f" stroke-width="5"/><path d="M370.000 202.500L370.000 240.000" fill="none" stroke="#176aab" stroke-width="4"/><path d="M20.000 240.000L475.000 240.000" fill="none" stroke="#64748b" stroke-width="2"/><path d="M60.000 231.000L69.000 231.000L69.000 240.000" fill="none" stroke="#176aab" stroke-width="1.6"/><path d="M370.000 231.000L379.000 231.000L379.000 240.000" fill="none" stroke="#176aab" stroke-width="1.6"/><path d="M25 90V240M20 90H30M20 240H30M60 257V269M60 263H260M260 257V269M370 257V269M370 263H420M420 257V269" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="16" y="172" font-size="24" fill="#22734f">h</text><text x="160" y="296" font-size="21" fill="#334155">影长 8 m</text><text x="395" y="296" font-size="21" fill="#334155">影长 2 m</text><text x="330" y="222" font-size="21" fill="#176aab">1.5 m</text></g></svg>