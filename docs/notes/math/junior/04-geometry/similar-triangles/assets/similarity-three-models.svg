<svg xmlns="http://www.w3.org/2000/svg" width="660" height="350" viewBox="0 0 660 350" role="img" aria-labelledby="title desc"><title id="title">相似三角形的三种常见图形</title><desc id="desc">左图为A型，DE平行BC，三角形ADE与ABC相似。中图为X型，两直线相交于A，DE平行BC，三角形ADE与ABC相似。右图角C为直角，CD垂直斜边AB，小三角形ACD、CBD分别与原三角形ABC相似。</desc><rect width="660" height="350" rx="12" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><path d="M220 45V335M440 45V335" stroke="#e2e8f0"/><g><text x="110" y="29" font-size="24" fill="#334155">A 型</text><path d="M110.000 65.000L40.000 225.000L180.000 225.000Z" fill="#eff6ff" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/><path d="M110.000 65.000L75.000 145.000L145.000 145.000Z" fill="#dbeafe" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/><path d="M75.000 145.000L145.000 145.000" fill="none" stroke="#176aab" stroke-width="3"/><path d="M40.000 225.000L180.000 225.000" fill="none" stroke="#176aab" stroke-width="3"/><text x="110" y="51" font-size="19" fill="#334155">A</text><text x="25" y="245" font-size="19" fill="#334155">B</text><text x="195" y="245" font-size="19" fill="#334155">C</text><text x="61" y="145" font-size="19" fill="#334155">D</text><text x="160" y="145" font-size="19" fill="#334155">E</text><text x="110" y="275" font-size="20" fill="#176aab">DE ∥ BC</text><text x="110" y="303" font-size="19" fill="#334155">△ADE ∼ △ABC</text><text x="110" y="329" font-size="17" fill="#64748b">共有角＋平行线</text></g><g transform="translate(220 0)"><text x="110" y="29" font-size="24" fill="#334155">X 型</text><path d="M110.000 145.000L40.000 225.000L180.000 225.000Z" fill="#eff6ff" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/><path d="M110.000 145.000L152.000 97.000L68.000 97.000Z" fill="#dbeafe" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/><path d="M152.000 97.000L68.000 97.000" fill="none" stroke="#176aab" stroke-width="3"/><path d="M40.000 225.000L180.000 225.000" fill="none" stroke="#176aab" stroke-width="3"/><text x="126" y="153" font-size="19" fill="#334155">A</text><text x="25" y="245" font-size="19" fill="#334155">B</text><text x="195" y="245" font-size="19" fill="#334155">C</text><text x="168" y="92" font-size="19" fill="#334155">D</text><text x="53" y="92" font-size="19" fill="#334155">E</text><text x="110" y="275" font-size="20" fill="#176aab">DE ∥ BC</text><text x="110" y="303" font-size="19" fill="#334155">△ADE ∼ △ABC</text><text x="110" y="329" font-size="17" fill="#64748b">对顶角＋平行线</text></g><g transform="translate(440 0)"><text x="110" y="29" font-size="22" fill="#334155">直角三角形作高</text><path d="M40.000 90.000L180.000 225.000L40.000 225.000Z" fill="#eff6ff" stroke="#334155" stroke-width="2.2" stroke-linejoin="round"/><path d="M40.000 225.000L107.455 155.046" fill="none" stroke="#176aab" stroke-width="3"/><path d="M40.000 216.000L49.000 216.000L49.000 225.000" fill="none" stroke="#176aab" stroke-width="1.6"/><path d="M101.208 161.525L107.687 167.772L113.934 161.293" fill="none" stroke="#176aab" stroke-width="1.6"/><text x="25" y="85" font-size="19" fill="#334155">A</text><text x="197" y="245" font-size="19" fill="#334155">B</text><text x="25" y="245" font-size="19" fill="#334155">C</text><text x="123.45538664904164" y="151.04626569729015" font-size="19" fill="#334155">D</text><text x="110" y="275" font-size="20" fill="#176aab">CD ⊥ AB</text><text x="110" y="303" font-size="19" fill="#334155">△ACD ∼ △ABC</text><text x="110" y="329" font-size="19" fill="#334155">△CBD ∼ △ABC</text></g></g></svg>