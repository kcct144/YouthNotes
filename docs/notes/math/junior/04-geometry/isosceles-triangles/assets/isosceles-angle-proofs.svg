<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">等腰三角形性质与判定的证明对照</title>
<desc id="desc">左右两图都作角A的平分线AD。左图已知AB等于AC，由边角边证明三角形ABD与ACD全等，得到两个底角相等；右图已知两个底角相等，由角角边证明两个小三角形全等，得到AB等于AC。蓝色标记表示已知，橙色标记表示结论；两幅图底角和腰分别用弧与短线表示，图下公式标明推理方向。</desc>
<rect width="640" height="350" rx="12" fill="#fff"/>
<path d="M320 49V309" stroke="#e2e8f0" stroke-width="1.5"/>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#334155"><g transform="translate(0 0)">
<text x="160" y="31" font-size="23">等边对等角（性质）</text>
<path d="M160 70L60 230H260Z" fill="#eff6ff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M160 70V230" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M145.16 93.74A28 28 0 0 0 160 98M160 98A28 28 0 0 0 174.84 93.74" fill="none" stroke="#64748b" stroke-width="1.8"/>
<path d="M104.9 146.8L115.1 153.2M204.9 153.2L215.1 146.8" stroke="#176aab" stroke-width="3"/>
<path d="M88 230A28 28 0 0 0 74.84 206.26M232 230A28 28 0 0 1 245.16 206.26" fill="none" stroke="#b45309" stroke-width="2.5"/>
<g font-family="Georgia, serif" font-size="23" font-style="italic"><text x="160" y="55">A</text><text x="44" y="249">B</text><text x="276" y="249">C</text><text x="160" y="254">D</text></g>
<text x="160" y="293" font-size="21" fill="#176aab">AB = AC → ∠B = ∠C</text>
</g><g transform="translate(320 0)">
<text x="160" y="31" font-size="23">等角对等边（判定）</text>
<path d="M160 70L60 230H260Z" fill="#eff6ff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M160 70V230" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M145.16 93.74A28 28 0 0 0 160 98M160 98A28 28 0 0 0 174.84 93.74" fill="none" stroke="#64748b" stroke-width="1.8"/>
<path d="M104.9 146.8L115.1 153.2M204.9 153.2L215.1 146.8" stroke="#b45309" stroke-width="3"/>
<path d="M88 230A28 28 0 0 0 74.84 206.26M232 230A28 28 0 0 1 245.16 206.26" fill="none" stroke="#176aab" stroke-width="2.5"/>
<g font-family="Georgia, serif" font-size="23" font-style="italic"><text x="160" y="55">A</text><text x="44" y="249">B</text><text x="276" y="249">C</text><text x="160" y="254">D</text></g>
<text x="160" y="293" font-size="21" fill="#176aab">∠B = ∠C → AB = AC</text>
</g><text x="320" y="336" font-size="18" fill="#64748b">蓝色：已知　橙色：结论　虚线：角平分线 AD</text></g>
</svg>