<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title desc">
<title id="title">底边上的点到两腰的距离和</title>
<desc id="desc">两个相同的等腰三角形ABC中，AB等于AC。左图P在底边BC上，PE垂直AB，PF垂直AC，两段垂线长分别为u和v。右图CH垂直AB，高为h。P在底边上移动时u和v会改变，但u加v始终等于h。</desc>
<rect width="600" height="370" rx="12" fill="#fff"/>
<path d="M300 46V319" stroke="#e2e8f0" stroke-width="1.5"/>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle"><g transform="translate(0 0)"><text x="150.000" y="28.000" font-size="22" fill="#334155">从 P 向两腰作垂线</text><path d="M150 65L40 245H260Z" fill="#eff6ff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/><path d="M89.9 151.9L100.1 158.1M199.9 158.1L210.1 151.9" fill="none" stroke="#334155" stroke-width="2"/><text x="150.000" y="48.000" font-size="21" fill="#334155">A</text><text x="25.000" y="266.000" font-size="21" fill="#334155">B</text><text x="275.000" y="266.000" font-size="21" fill="#334155">C</text><path d="M120.000 245.000L61.753 209.404" fill="none" stroke="#b45309" stroke-width="3"/><path d="M120.000 245.000L221.933 182.708" fill="none" stroke="#176aab" stroke-width="3"/><path d="M69.432 214.098L74.125 206.418L66.446 201.725" fill="none" stroke="#b45309" stroke-width="1.7"/><path d="M214.253 187.401L209.560 179.721L217.240 175.028" fill="none" stroke="#176aab" stroke-width="1.7"/><circle cx="120" cy="245" r="4" fill="#334155"/><text x="120.000" y="269.000" font-size="21" fill="#334155">P</text><text x="47.753" y="205.404" font-size="18" fill="#334155">E</text><text x="235.933" y="179.708" font-size="18" fill="#334155">F</text><text x="83.876" y="220.202" font-size="25" fill="#b45309">u</text><text x="177.966" y="206.854" font-size="25" fill="#176aab">v</text><text x="150.000" y="307.000" font-size="20" fill="#334155">两段距离相加：u + v</text></g><g transform="translate(300 0)"><text x="150.000" y="28.000" font-size="22" fill="#334155">从 C 向腰 AB 作高</text><path d="M150 65L40 245H260Z" fill="#eff6ff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/><path d="M89.9 151.9L100.1 158.1M199.9 158.1L210.1 151.9" fill="none" stroke="#334155" stroke-width="2"/><text x="150.000" y="48.000" font-size="21" fill="#334155">A</text><text x="25.000" y="266.000" font-size="21" fill="#334155">B</text><text x="275.000" y="266.000" font-size="21" fill="#334155">C</text><path d="M260.000 245.000L99.820 147.112" fill="none" stroke="#22734f" stroke-width="3"/><path d="M107.500 151.805L112.193 144.126L104.513 139.433" fill="none" stroke="#22734f" stroke-width="1.7"/><text x="85.820" y="141.112" font-size="18" fill="#334155">H</text><text x="189.910" y="186.056" font-size="25" fill="#22734f">h</text><text x="150.000" y="307.000" font-size="20" fill="#22734f">一条腰上的高：h</text></g><text x="300.000" y="354.000" font-size="27" fill="#176aab">u + v = h</text></g></svg>