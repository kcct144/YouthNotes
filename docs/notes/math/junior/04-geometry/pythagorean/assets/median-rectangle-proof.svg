<svg xmlns="http://www.w3.org/2000/svg" width="520" height="310" viewBox="0 0 520 310" role="img" aria-labelledby="title desc">
  <title id="title">延长斜边中线，补成矩形</title>
  <desc id="desc">三角形ABC的角C为直角，M为斜边AB中点。延长CM到D，使MD等于CM。四边形ACBD的两条对角线AB、CD互相平分且有一个直角，所以是矩形。矩形对角线相等，故AB等于CD等于2CM。灰色和蓝色虚线为补出的线段。</desc>
  <rect width="520" height="310" rx="12" fill="#fff"/>
  <path d="M120 55V235H400Z" fill="#dbeafe"/>
  <path d="M120 55H400V235Z" fill="#f1f5f9"/>
  <path d="M120 55V235H400L120 55" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M120 55H400V235" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M120 235L260 145" fill="none" stroke="#176aab" stroke-width="3"/>
  <path d="M260 145L400 55" fill="none" stroke="#176aab" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M120 215H140V235" fill="none" stroke="#334155" stroke-width="2"/>
  <g stroke-width="2">
    <path d="M183.4 187.1L189.9 197.2M190.1 182.8L196.6 192.9M323.4 97.1L329.9 107.2M330.1 92.8L336.6 102.9" stroke="#176aab"/>
    <path d="M186.8 105L193.2 95M326.8 195L333.2 185" stroke="#334155"/>
  </g>
  <circle cx="260" cy="145" r="4.5" fill="#b45309"/>
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" font-size="23" fill="#334155">
    <text x="103" y="48">A</text><text x="418" y="254">B</text><text x="103" y="255">C</text><text x="418" y="48">D</text>
    <text x="260" y="127" fill="#b45309">M</text>
    <text x="260" y="288" fill="#176aab">AB = CD = 2CM</text>
  </g>
</svg>
