<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
  <title id="title">直角边与斜边的常用字母约定</title>
  <desc id="desc">三角形ABC的角C为直角。BC和CA是直角边，长度分别记为a、b；直角所对的AB是斜边，长度记为c。斜边是这个三角形中最长的边。</desc>
  <rect width="480" height="300" rx="12" fill="#fff"/>
  <path d="M120 55V240H420Z" fill="#eff6ff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M120 55L420 240" fill="none" stroke="#176aab" stroke-width="3.5"/>
  <path d="M120 220H140V240" fill="none" stroke="#334155" stroke-width="2"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" fill="#334155">
    <text x="120" y="35" font-family="Georgia, serif" font-style="italic">A</text>
    <text x="440" y="247" font-family="Georgia, serif" font-style="italic">B</text>
    <text x="103" y="260" font-family="Georgia, serif" font-style="italic">C</text>
    <text x="66" y="145" font-family="Georgia, serif" font-style="italic" font-size="25">b</text>
    <text x="66" y="173" font-size="19">直角边</text>
    <text x="270" y="276"><tspan font-family="Georgia, serif" font-style="italic" font-size="25">a</tspan><tspan>（直角边）</tspan></text>
    <text x="280" y="131" fill="#176aab" transform="rotate(31.665 280 131)"><tspan font-family="Georgia, serif" font-style="italic" font-size="25">c</tspan><tspan>（斜边，最长）</tspan></text>
  </g>
</svg>
