<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" role="img" aria-labelledby="title"><title id="title">二的三次方中二是底数三是指数</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><text x="170" y="130" font-size="85" fill="#2563eb" text-anchor="middle" font-weight="normal">2</text><text x="215" y="74" font-size="45" fill="#d97706" text-anchor="middle" font-weight="normal">3</text><line x1="150" y1="142" x2="90" y2="175" stroke="#2563eb" stroke-width="2.5"/><text x="75" y="202" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="normal">底数</text><line x1="235" y1="68" x2="310" y2="50" stroke="#d97706" stroke-width="2.5"/><text x="350" y="57" font-size="20" fill="#d97706" text-anchor="middle" font-weight="normal">指数</text><text x="255" y="205" font-size="23" fill="#334155" text-anchor="middle" font-weight="normal">2 × 2 × 2 = 8</text></g></svg>
