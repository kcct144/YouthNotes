<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="title"><title id="title">九的平方根有正三和负三算术平方根是正三</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><rect x="245" y="75" width="100" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="295" y="122" font-size="36" fill="#334155" text-anchor="middle" font-weight="normal">9</text><text x="100" y="121" font-size="32" fill="#2563eb" text-anchor="middle" font-weight="normal">3</text><line x1="145" y1="110" x2="240" y2="110" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="100" y="167" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">3² = 9</text><text x="490" y="121" font-size="32" fill="#2563eb" text-anchor="middle" font-weight="normal">−3</text><line x1="445" y1="110" x2="350" y2="110" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="490" y="167" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">(−3)² = 9</text><text x="300" y="210" font-size="21" fill="#d97706" text-anchor="middle" font-weight="normal">平方根：±3；算术平方根：3</text></g></svg>
