<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-labelledby="title"><title id="title">边长a加b的正方形分成a平方两个ab和b平方</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><rect x="80" y="40" width="180" height="180" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170" y="138" font-size="25" fill="#334155" text-anchor="middle" font-weight="normal">a²</text><rect x="260" y="40" width="80" height="180" rx="0" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="300" y="138" font-size="25" fill="#334155" text-anchor="middle" font-weight="normal">ab</text><rect x="80" y="220" width="180" height="80" rx="0" fill="#fef3c7" stroke="#2563eb" stroke-width="2"/><text x="170" y="268" font-size="25" fill="#334155" text-anchor="middle" font-weight="normal">ab</text><rect x="260" y="220" width="80" height="80" rx="0" fill="#dcfce7" stroke="#2563eb" stroke-width="2"/><text x="300" y="268" font-size="25" fill="#334155" text-anchor="middle" font-weight="normal">b²</text><text x="170" y="27" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="normal">a</text><text x="300" y="27" font-size="20" fill="#d97706" text-anchor="middle" font-weight="normal">b</text><text x="57" y="137" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="normal">a</text><text x="57" y="267" font-size="20" fill="#d97706" text-anchor="middle" font-weight="normal">b</text><text x="210" y="332" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">(a + b)² = a² + 2ab + b²</text></g></svg>
