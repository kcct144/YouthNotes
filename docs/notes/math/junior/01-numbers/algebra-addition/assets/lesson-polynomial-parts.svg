<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 245" role="img" aria-labelledby="title"><title id="title">用三倍x平方减二x加五识别项系数和次数</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><text x="300" y="74" font-size="39" fill="#334155" text-anchor="middle" font-weight="normal">3x²  −  2x  +  5</text><line x1="210" y1="92" x2="210" y2="125" stroke="#2563eb" stroke-width="2.5"/><text x="210" y="151" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="normal">二次项</text><line x1="320" y1="92" x2="320" y2="125" stroke="#2563eb" stroke-width="2.5"/><text x="320" y="151" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="normal">一次项</text><line x1="425" y1="92" x2="425" y2="125" stroke="#2563eb" stroke-width="2.5"/><text x="425" y="151" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="normal">常数项</text><text x="300" y="201" font-size="21" fill="#d97706" text-anchor="middle" font-weight="normal">共 3 项，最高次数为 2</text></g></svg>
