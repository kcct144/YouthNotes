<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 235" role="img" aria-labelledby="title"><title id="title">同底数幂相乘把因数接起来幂的乘方把每组重复</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><text x="90" y="66" font-size="27" fill="#2563eb" text-anchor="middle" font-weight="normal">a³ · a²</text><line x1="160" y1="58" x2="200" y2="58" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="395" y="66" font-size="22" fill="#334155" text-anchor="middle" font-weight="normal">(a · a · a) · (a · a) = a⁵</text><text x="90" y="160" font-size="27" fill="#2563eb" text-anchor="middle" font-weight="normal">(a³)²</text><line x1="160" y1="152" x2="200" y2="152" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="395" y="160" font-size="22" fill="#334155" text-anchor="middle" font-weight="normal">(a · a · a) · (a · a · a) = a⁶</text><text x="300" y="211" font-size="19" fill="#d97706" text-anchor="middle" font-weight="normal">相乘：指数相加；乘方：指数相乘</text></g></svg>
