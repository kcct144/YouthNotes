<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title"><title id="title">同一组数据的平均数为三中位数为二众数为二</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><rect x="65" y="40" width="70" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="100" y="86" font-size="30" fill="#334155" text-anchor="middle" font-weight="normal">1</text><rect x="165" y="40" width="70" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="200" y="86" font-size="30" fill="#334155" text-anchor="middle" font-weight="normal">2</text><rect x="265" y="40" width="70" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="300" y="86" font-size="30" fill="#334155" text-anchor="middle" font-weight="normal">2</text><rect x="365" y="40" width="70" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="400" y="86" font-size="30" fill="#334155" text-anchor="middle" font-weight="normal">3</text><rect x="465" y="40" width="70" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="500" y="86" font-size="30" fill="#334155" text-anchor="middle" font-weight="normal">7</text><line x1="300" y1="115" x2="300" y2="145" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/><text x="300" y="175" font-size="22" fill="#d97706" text-anchor="middle" font-weight="normal">排好序后，中间的数是 2</text><text x="300" y="222" font-size="23" fill="#334155" text-anchor="middle" font-weight="normal">平均数 = 3；中位数 = 2；众数 = 2</text><text x="300" y="258" font-size="18" fill="#334155" text-anchor="middle" font-weight="normal">2 出现两次，次数最多</text></g></svg>
