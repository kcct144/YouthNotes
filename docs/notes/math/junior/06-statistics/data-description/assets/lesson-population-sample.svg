<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-labelledby="title"><title id="title">总体中抽取部分个体形成样本样本容量是个数</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><rect x="25" y="35" width="245" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="147" y="78" font-size="25" fill="#2563eb" text-anchor="middle" font-weight="normal">总体</text><text x="147" y="118" font-size="19" fill="#334155" text-anchor="middle" font-weight="normal">全校学生的身高</text><rect x="62" y="150" width="170" height="54" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="147" y="184" font-size="18" fill="#d97706" text-anchor="middle" font-weight="normal">抽取 100 份记录</text><line x1="280" y1="160" x2="340" y2="160" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="355" y="70" width="220" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="465" y="110" font-size="25" fill="#d97706" text-anchor="middle" font-weight="normal">样本</text><text x="465" y="152" font-size="18" fill="#334155" text-anchor="middle" font-weight="normal">被抽取的身高数据</text><text x="465" y="190" font-size="20" fill="#334155" text-anchor="middle" font-weight="normal">152，160，…</text><text x="300" y="273" font-size="21" fill="#334155" text-anchor="middle" font-weight="normal">样本是数据，样本容量是个数：100</text></g></svg>
