<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 325" role="img" aria-labelledby="title"><title id="title">条形图比较数量扇形图显示占比折线图显示随时间变化</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><text x="110" y="30" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="normal">数量：上学方式</text><line x1="30" y1="230" x2="205" y2="230" stroke="#334155" stroke-width="1.5"/><line x1="30" y1="230" x2="30" y2="65" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="54" font-size="15" fill="#334155" text-anchor="middle" font-weight="normal">人数</text><rect x="50" y="92" width="30" height="138" rx="0" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="65" y="87" font-size="17" fill="#334155" text-anchor="middle" font-weight="normal">6</text><text x="65" y="253" font-size="15" fill="#334155" text-anchor="middle" font-weight="normal">步行</text><rect x="105" y="161" width="30" height="69" rx="0" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="120" y="156" font-size="17" fill="#334155" text-anchor="middle" font-weight="normal">3</text><text x="120" y="253" font-size="15" fill="#334155" text-anchor="middle" font-weight="normal">骑车</text><rect x="160" y="207" width="30" height="23" rx="0" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="175" y="202" font-size="17" fill="#334155" text-anchor="middle" font-weight="normal">1</text><text x="175" y="253" font-size="15" fill="#334155" text-anchor="middle" font-weight="normal">乘车</text><text x="330" y="30" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="normal">占比：上学方式</text><path d="M330,160 L330.0,78.0 A82,82 0 1 1 281.8016093120172,226.3393935387457 Z" fill="#bfdbfe" stroke="#334155" str