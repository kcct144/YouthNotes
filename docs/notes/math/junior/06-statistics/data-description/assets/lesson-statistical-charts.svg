normal">2</text><circle cx="575" cy="131" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="575" y="119" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="normal">11</text><text x="575" y="253" font-size="16" fill="#334155" text-anchor="middle" font-weight="normal">3</text><circle cx="620" cy="95" r="3" fill="#2563eb" stroke="#2563eb" stroke-width="1"/><text x="620" y="83" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="normal">15</text><text x="620" y="253" font-size="16" fill="#334155" text-anchor="middle" font-weight="normal">4</text><text x="620" y="278" font-size="16" fill="#334155" text-anchor="middle" font-weight="normal">周</text><text x="330" y="312" font-size="20" fill="#334155" text-anchor="middle" font-weight="normal">条形看数量，扇形看占比，折线看变化</text></g></svg>
