<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="title"><title id="title">短段比长段等于长段比全长</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><line x1="65" y1="95" x2="355.476" y2="95" stroke="#2563eb" stroke-width="6"/><line x1="355.476" y1="95" x2="535" y2="95" stroke="#d97706" stroke-width="6"/><circle cx="65" cy="95" r="3" fill="#334155" stroke="#334155" stroke-width="1"/><text x="65" y="79" font-size="18" fill="#334155" text-anchor="middle" font-weight="normal">A</text><circle cx="355.476" cy="95" r="3" fill="#334155" stroke="#334155" stroke-width="1"/><text x="355.476" y="79" font-size="18" fill="#334155" text-anchor="middle" font-weight="normal">C</text><circle cx="535" cy="95" r="3" fill="#334155" stroke="#334155" stroke-width="1"/><text x="535" y="79" font-size="18" fill="#334155" text-anchor="middle" font-weight="normal">B</text><text x="210.238" y="140" font-size="19" fill="#2563eb" text-anchor="middle" font-weight="normal">长段 ≈ 0.618 × 全长</text><text x="445.238" y="140" font-size="20" fill="#d97706" text-anchor="middle" font-weight="normal">短段</text><text x="300" y="205" font-size="24" fill="#334155" text-anchor="middle" font-weight="normal">短段 : 长段 = 长段 : 全长</text></g></svg>
