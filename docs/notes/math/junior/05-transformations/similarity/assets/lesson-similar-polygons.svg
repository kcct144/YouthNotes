<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title"><title id="title">放大两倍的两个矩形对应角相等对应边成比例</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8fafc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" stroke-linecap="round"><rect x="50" y="125" width="140" height="70" rx="0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="285" y="70" width="280" height="140" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="120" y="230" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="normal">宽 2，长 4</text><text x="425" y="245" font-size="21" fill="#d97706" text-anchor="middle" font-weight="normal">宽 4，长 8</text><line x1="205" y1="150" x2="265" y2="150" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="234" y="124" font-size="20" fill="#334155" text-anchor="middle" font-weight="normal">× 2</text><text x="300" y="283" font-size="22" fill="#334155" text-anchor="middle" font-weight="normal">长度比 1:2，面积比 1:4</text></g></svg>
